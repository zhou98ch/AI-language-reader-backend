nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['https://ai-language-reader-frontend.vercel.app']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['https://ai-language-reader-frontend.vercel.app']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization']
